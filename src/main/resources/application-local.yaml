    base-path: ${FILE_STORAGE_BASE_PATH:/app/storage}

parameter:
  max-char-per-request: 35000
  min-delay-ms: 3000
  batch-size: 5
  max-retry: 5
  wait-time: 20000
  max-repair-retry: 20
  chunk_size: 8000
  chunk_overlap: 1000

