server:
  port: 8083

logging:
  level:
    root: INFO

spring:
  datasource:
    url: jdbc:mysql://mysql-local:3306/bidding?createDatabaseIfNotExist=true
    username: root
    password: root
    initialization-mode: always
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      validation-timeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.url}/realms/master
  mail:
    host: smtp.gmail.com
    port: 587
    username: ankitmanchanda07@gmail.com
    password: TEST
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always



ai:
  type: github_model
  api:
